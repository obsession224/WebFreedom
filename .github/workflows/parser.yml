name: WebFreedom Auto Parser

on:
  schedule:
    # Запуск в 06:15 и 18:15 по UTC (по МСК это 09:15 и 21:15 ежедневно)
    - cron: '15 6,18 * * *'
  
  # Кнопка для ручного запуска парсера из браузера
  workflow_dispatch:

# Принудительно заставляем среду выполнения использовать Node.js 24, убирая предупреждения депрекации
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Обновлено до актуальной версии v4
    - name: Checkout repository
      uses: actions/checkout@v4

    # Обновлено до актуальной версии v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run main.py script
      run: |
        python main.py

    # Обновлено до актуальной версии v3
    - name: Upload artifact for Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  deploy-pages:
    needs: build-and-run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    # Обновлено до актуальной версии v4
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
