name: WebFreedom Auto Parser

on:
  schedule:
    # Запуск в xx:17
    - cron: '17 * * * *'
  
  # Кнопка для ручного запуска парсера из браузера
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Обновлено до v4 (актуальная стабильная версия)
    - name: Checkout repository
      uses: actions/checkout@v4

    # Обновлено до v5 (актуальная стабильная версия)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Переход на современный шаг сборки без предупреждений
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run main.py script
      run: |
        python main.py

    # ВАЖНО: GitHub Pages обновил требования к артефактам, используем v3
    - name: Upload artifact for Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  deploy-pages:
    needs: build-and-run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    # Обновлено до v4 (актуальная стабильная версия деплоя)
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
